name: Promote approved SQL snapshots across environments

on:
  push:
    branches:
      - qa
      - stage
      - main
    paths:
      - 'dev-snapshots/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: snowflake-promotion-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-environment:
    name: Deploy and verify ${{ github.ref_name == 'qa' && 'QA' || github.ref_name == 'stage' && 'STAGE' || 'PROD' }}
    if: ${{ github.ref_name == 'qa' || github.ref_name == 'stage' || github.ref_name == 'main' }}
    env:
      SNOWFLAKE_TARGET: ${{ github.ref_name == 'qa' && 'QA' || github.ref_name == 'stage' && 'STAGE' || 'PROD' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved environment branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Snowflake CLI and configure OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: '3.16'

      - name: Validate and promote changed snapshots
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/promote_snapshots.py --deploy --base "$BASE_SHA"

      - name: Verify promoted environment objects
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/verify_deployment.py --base "$BASE_SHA"

  audit-deployment:
    name: Record ${{ github.ref_name == 'qa' && 'QA' || github.ref_name == 'stage' && 'STAGE' || 'PROD' }} deployment audit in AWS
    needs: deploy-environment
    if: ${{ always() && (github.ref_name == 'qa' || github.ref_name == 'stage' || github.ref_name == 'main') }}
    runs-on: ubuntu-latest
    env:
      AUDIT_ENV: ${{ github.ref_name == 'qa' && 'QA' || github.ref_name == 'stage' && 'STAGE' || 'PROD' }}

    steps:
      - name: Checkout deployment revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_AUDIT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send deployment result to Lambda
        env:
          FUNCTION_NAME: ${{ vars.AWS_AUDIT_LAMBDA_NAME }}
          DEPLOY_STATUS: ${{ needs.deploy-environment.result }}
          BASE_SHA: ${{ github.event.before }}
        run: |
          OBJECTS=$(git diff --name-only "$BASE_SHA" HEAD -- dev-snapshots/ \
            | awk '/\.sql$/ {print}' | paste -sd ',' -)

          PAYLOAD=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg run "$GITHUB_RUN_ID" \
            --arg status "$DEPLOY_STATUS" \
            --arg environment "$AUDIT_ENV" \
            --arg objects "$OBJECTS" \
            '{
              repository: $repo,
              environment: $environment,
              run_id: $run,
              status: $status,
              object: $objects,
              verification: (
                if $status == "success"
                then "passed"
                else "failed_or_incomplete"
                end
              )
            }')

          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload "$PAYLOAD" \
            /tmp/audit-response.json

          cat /tmp/audit-response.json
          jq -e '.statusCode == 200 and ((.body | fromjson).logged == true)' \
            /tmp/audit-response.json
