name: Sync Snowflake DEV snapshots

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: snowflake-dev-snapshot
  cancel-in-progress: false

jobs:
  sync-dev:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Snowflake CLI and configure OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: '3.16'

      - name: Discover and snapshot DEV SQL objects
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: python3 scripts/sync_dev.py

      - name: Commit snapshots for review
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          git add -A dev-snapshots/
          if git diff --cached --quiet; then
            echo 'No DEV definition changes found.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          BRANCH="sync/dev-all-${GITHUB_RUN_ID}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git commit -m 'Snapshot Snowflake DEV object definitions'
          git push origin "HEAD:refs/heads/$BRANCH"

          echo "Review changes and open a pull request:" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/${GH_REPO}/compare/main...${BRANCH}?expand=1" >> "$GITHUB_STEP_SUMMARY"
