name: Validate Snowflake SQL

on:
  pull_request:
    branches:
      - dev
      - qa
      - stage
      - main

permissions:
  contents: read

jobs:
  validate:
    name: SQL Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run offline deployment verification tests
        run: python3 -m unittest discover -s tests -v

      - name: Enforce DEV to QA to STAGE to PROD promotion order
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          python3 scripts/check_promotion_path.py \
            --base-sha "$BASE_SHA" --base-branch "$PR_BASE" \
            --head-branch "$PR_HEAD" --head-repo "$PR_HEAD_REPO" \
            --repository "$GITHUB_REPOSITORY"

      - name: Validate snapshot promotion policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          if [ "$PR_BASE" = "dev" ]; then
            python3 scripts/promote_snapshots.py --check --source-sync --base "$BASE_SHA"
          else
            python3 scripts/promote_snapshots.py --check --base "$BASE_SHA"
          fi

      - name: Check existing SQL deployment policy
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys
          files = sorted(Path('database').rglob('*.sql'))
          errors = []
          if not files:
              errors.append('No SQL files found.')
          blocked = re.compile(
              r'(?im)(?:^|;)\s*'
              r'(DROP|TRUNCATE|DELETE|UPDATE|GRANT|REVOKE|ALTER)\b'
          )
          allowed_start = re.compile(
              r'(?is)^\s*CREATE\s+'
              r'(?:OR\s+REPLACE\s+)?'
              r'(TABLE|VIEW|PROCEDURE)\b'
          )
          for file in files:
              sql = file.read_text(encoding='utf-8')
              sql = re.sub(r'/\*.*?\*/', '', sql, flags=re.S)
              sql = re.sub(r'(?m)^\s*--[^\n]*', '', sql)
              if not allowed_start.match(sql):
                  errors.append(f'{file}: Expected CREATE TABLE, VIEW or PROCEDURE.')
              match = blocked.search(sql)
              if match:
                  errors.append(f'{file}: Prohibited statement: {match.group(1)}')
          for error in errors:
              print(f'::error::{error}')
          if errors:
              sys.exit(1)
          print(f'SQL policy validation PASSED ({len(files)} files)')
          PY
