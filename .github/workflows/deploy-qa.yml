name: Deploy approved DEV snapshots to QA

on:
  push:
    branches:
      - main
    paths:
      - 'dev-snapshots/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: snowflake-qa-deployment
  cancel-in-progress: false

jobs:
  deploy-qa:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved main revision with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Snowflake CLI and configure OIDC
        uses: snowflakedb/snowflake-actions@v3
        with:
          use-oidc: true
          cli-version: '3.16'

      - name: Validate and promote changed snapshots
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          BASE_SHA: ${{ github.event.before }}
        run: python3 scripts/promote_qa.py --deploy --base "$BASE_SHA"
